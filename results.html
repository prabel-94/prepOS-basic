<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>PrepOS Results</title>

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="container">

  <div class="page-title">Exam Results</div>

  <div id="results">Loading…</div>

</div>

<script>

const SUPABASE_URL="https://bcqjfosxneuyoyuzhdiq.supabase.co"
const ANON="YOUR_KEY"

/* helpers */
function escapeHTML(str){
return String(str)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");
}

/* get exam id */
const params=new URLSearchParams(location.search)
const examId=params.get("id")

async function loadResults(){

const res=await fetch(
`${SUPABASE_URL}/rest/v1/exam_attempts?exam_id=eq.${examId}&order=submitted_at.desc`,
{
headers:{
apikey:ANON,
Authorization:`Bearer ${ANON}`
}
}
)

if(!res.ok){
console.error("Failed to load results",res.status)
document.getElementById("results").innerText="Failed to load results"
return
}

const data=await res.json()

const container=document.getElementById("results")
container.innerHTML=""

if(!data.length){
container.innerText="No responses yet"
return
}

data.forEach(r=>{

const submitted = r.submitted_at
  ? new Date(r.submitted_at).toLocaleString()
  : "-";

const card=document.createElement("div")
card.className="attempt-card"

card.innerHTML=`

  <div class="attempt-header">
    <div class="student-name">
      ${escapeHTML(r.student_name || "Unknown")}
    </div>

    <div class="score-badge">
      ${r.score ?? "-"}
    </div>
  </div>

  <div class="attempt-meta">
    ${submitted}
  </div>

  <div class="attempt-actions">
    <button class="primary-btn view-btn">View Answers</button>
    <button class="secondary-btn download-btn hidden">
      Download PDF
    </button>
  </div>

  <div class="answer-box"></div>
`

const viewBtn = card.querySelector(".view-btn")
const answerBox = card.querySelector(".answer-box")

viewBtn.onclick=()=>{

if(answerBox.classList.contains("hidden") || answerBox.style.display==="none"){

  answerBox.innerHTML = r.answers.map(a=>
    `<div class="answer-row">Q${a.q+1}: <b>${a.chosen}</b></div>`
  ).join("")

  answerBox.style.display="block"
  viewBtn.innerText="Hide Answers"

}else{

  answerBox.style.display="none"
  viewBtn.innerText="View Answers"

}

}

container.appendChild(card)

})

}

loadResults()

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="assets/prepos-icon.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PrepOS Results</title>

<link rel="stylesheet" href="css/style.css">

</head>

<body class="pro-surface">

<div id="app-nav-root"></div>

<div class="container">

  <div class="card mt-20">
    <label>Select exam</label>

    <div class="flex gap-10 mt-10">
      <select id="examSelect"></select>

      <select id="sortSelect">
        <option value="latest">Latest</option>
        <option value="high">Highest Score</option>
        <option value="low">Lowest Score</option>
      </select>

      <button onclick="exportCSV()" class="secondary-btn">
        Export CSV
      </button>
    </div>
  </div>

  <div id="results" class="mt-20">
    Loading…
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js?v=20260520"></script>
<script type="module" src="js/auth.js"></script>
<script type="module" src="js/teacher-results.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>

  <link rel="icon" type="image/png" href="assets/prepos-icon.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>PrepOS Exam</title>

  <meta name="description" content="PrepOS Online Exam Platform">

  <link rel="stylesheet" href="css/style.css">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js?v=20260520"></script>
  <script type="module" src="js/exam.js" defer></script>

</head>


<body class="exam-page">

  <main class="exam-wrapper">

    <header class="exam-header" id="examHeader">

      <div class="exam-header-left">
        <a id="examHomeBtn" class="exam-home-btn hidden" href="#">← Home</a>
        <img
          id="examLogo"
          class="exam-logo hidden"
          alt="Exam logo"
        >
      </div>

      <div class="exam-header-right">
        <h2 id="examTitle">PrepOS Exam</h2>
        <div id="examQuestionIndicator" class="exam-question-indicator hidden"></div>
        <div class="timer-box" id="examTimer">00:00</div>
      </div>

    </header>

    <div id="examInspectBanner" class="exam-inspect-banner hidden" role="status">
      Teacher inspect — no timer, no submit, answers are not recorded.
    </div>

    <div id="examProgressPanel" class="exam-progress-panel hidden" aria-live="polite">
      <div
        class="exam-progress-bar"
        role="progressbar"
        aria-valuemin="0"
        aria-valuemax="100"
        aria-valuenow="0"
        id="examProgressBar"
      >
        <div class="exam-progress-fill" id="examProgressFill"></div>
      </div>
      <div class="exam-progress-label" id="examProgressLabel">0 / 0 Answered</div>
    </div>

    <section class="exam-overview card hidden" id="examOverviewSection" aria-label="Exam overview">

      <h2 id="overviewExamTitle" class="exam-overview-title">Exam</h2>

      <dl class="exam-overview-meta" id="examOverviewMeta"></dl>

      <div id="examOverviewTopics" class="exam-overview-topics hidden">
        <div class="exam-overview-topics-label">Topics Covered</div>
        <ul id="examOverviewTopicsList" class="exam-overview-topics-list"></ul>
      </div>

      <div id="overviewNameRow" class="exam-overview-name hidden">
        <label for="studentName">Your name</label>
        <input
          id="studentName"
          type="text"
          placeholder="Enter your name"
          autocomplete="name"
        >
      </div>

      <button type="button" id="startExamBtn" class="primary-btn w-full mt-20">
        Start Exam
      </button>

    </section>

    <section id="quiz" class="quiz-container">

      <div id="loadingState" class="loading-state">
        <p>Loading exam...</p>
      </div>

      <div id="errorState" class="error-state hidden">
        <p id="errorMessage"></p>
        <button type="button" onclick="location.reload()">Retry</button>
      </div>

      <div id="examContent" class="exam-content hidden"></div>

    </section>

    <section id="result" class="result-container"></section>

  </main>

  <button type="button" id="examReviewFab" class="exam-review-fab hidden">
    Review &amp; Submit
  </button>

  <div id="examReviewModal" class="prepos-modal hidden" aria-hidden="true">
    <div class="prepos-modal-backdrop"></div>
    <div class="prepos-modal-content exam-review-modal-content">
      <div class="prepos-modal-header">
        <div class="h2">Review &amp; Submit</div>
        <p class="text-muted mt-5">Check your progress before submitting.</p>
      </div>
      <div class="prepos-modal-body">
        <dl class="exam-review-summary">
          <dt>Answered</dt>
          <dd id="examReviewAnswered">0</dd>
          <dt>Unanswered</dt>
          <dd id="examReviewUnanswered">0</dd>
        </dl>
      </div>
      <div class="prepos-modal-footer exam-review-modal-footer">
        <button type="button" class="secondary-btn" id="examReviewContinueBtn">Continue Exam</button>
        <button type="button" class="primary-btn" id="examReviewSubmitBtn">Submit Exam</button>
      </div>
    </div>
  </div>

  <noscript>
    <div style="padding:20px;font-size:18px;text-align:center">
      This exam requires JavaScript to run.<br>
      Please enable JavaScript in your browser.
    </div>
  </noscript>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>

  <link rel="icon" type="image/png" href="assets/prepos-icon.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>PrepOS Exam</title>

  <meta name="description" content="PrepOS Online Exam Platform">

  <!-- Styles -->
  <link rel="stylesheet" href="css/style.css">

  <!-- PDF Generator -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Config + Logic -->
  <script src="js/config.js" defer></script>
  <script src="js/exam.js" defer></script>

</head>


<body class="exam-page">

  <main class="exam-wrapper">

    <!-- ================= HEADER ================= -->

    <header class="exam-header">

      <div class="exam-header-left">
        <img 
          id="examLogo"
          class="exam-logo hidden"
          alt="Exam logo"
        >
      </div>

      <div class="exam-header-right">
        <h2 id="examTitle">PrepOS Exam</h2>
        <div id="examSubtitle" class="exam-subtitle"></div>
      </div>

    </header>


    <!-- ================= STUDENT INFO ================= -->

    <section class="student-info">

      <label for="studentName">Enter your name</label>

      <input
        id="studentName"
        type="text"
        placeholder="Your name"
        autocomplete="off"
        required
      >

    </section>


    <!-- ================= QUIZ AREA ================= -->

    <section id="quiz" class="quiz-container">

      <!-- Loading State -->
      <div id="loadingState" class="loading-state">
        <p>Loading exam...</p>
      </div>

      <!-- Error State -->
      <div id="errorState" class="error-state hidden">
        <p id="errorMessage"></p>
        <button onclick="location.reload()">Retry</button>
      </div>

      <!-- Exam Content -->
      <div id="examContent" class="exam-content hidden">
        <!-- Questions render here -->
      </div>

    </section>


    <!-- ================= RESULT AREA ================= -->

    <section id="result" class="result-container"></section>

  </main>


  <!-- ================= NOSCRIPT ================= -->

  <noscript>
    <div style="padding:20px;font-size:18px;text-align:center">
      This exam requires JavaScript to run.<br>
      Please enable JavaScript in your browser.
    </div>
  </noscript>

<!-- Debug Console -->
<script src="https://cdn.jsdelivr.net/npm/eruda"></script>
<script>
  eruda.init();
</script>

</body>

</html>

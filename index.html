<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PrepOS Home</title>

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<h1>PrepOS</h1>
<div class="small">Teacher Console</div>


<!-- =========================
Create Exam (PRIMARY ENTRY)
========================= -->

<div class="card">

<h3>Create Exam</h3>

<p>Start a new exam using parser or manual entry.</p>

<button onclick="goToCreatorMode()" class="primary-btn">
Create Exam
</button>

</div>


<!-- =========================
Knowledge & Management (NEW)
========================= -->

<div class="card">

<h3>Knowledge & Management</h3>

<p>Manage your question bank and drafts.</p>

<div class="flex gap-10 mt-10">

<button onclick="location.href='qb-manager.html'">
📚 Question Bank
</button>

<button onclick="location.href='draft.html'">
📄 Drafts
</button>

</div>

</div>


<!-- =========================
Recent Exams
========================= -->

<div class="card">

<h3>Recent Exams</h3>

<div id="recentExams">
Loading recent exams...
</div>

</div>


<!-- =========================
Results Viewer
========================= -->

<div class="card">

<h3>Results Viewer</h3>

<p>Browse submissions by exam.</p>

<button onclick="location.href='teacher-results.html'">
Open Viewer
</button>

</div>


<!-- =========================
Open Exam
========================= -->

<div class="card">

<h3>Open Exam</h3>

<p>Preview exam using id.</p>

<input
id="examId2"
placeholder="Paste exam id"
class="w-full p-8 mt-10"
>

<button onclick="openExam()">
Open Exam
</button>

</div>


<!-- =========================
Scripts
========================= -->
<script src="js/auth.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>


<script>

/* =========================
Navigation: Creator Mode
========================= */

function goToCreatorMode(){
  location.href = "creator-mode.html"
}


/* =========================
Open Exam
========================= */

window.openExam = function(){

const id = document.getElementById("examId2").value.trim()

if(!id){
alert("Enter exam id")
return
}

location.href = `exam.html?id=${id}`

}


/* =========================
Recent Exams Loader
========================= */

async function loadRecentExams(){

const container = document.getElementById("recentExams")

try{

const res = await fetch(

`${SUPABASE_URL}/rest/v1/exam_sessions?select=id,title,created_at&order=created_at.desc&limit=5`,

{
headers:{
apikey: SUPABASE_ANON_KEY,
Authorization:`Bearer ${SUPABASE_ANON_KEY}`
}
}

)

if(!res.ok){
throw new Error("Failed to load exams")
}

const data = await res.json()

container.innerHTML=""

if(!data.length){

container.innerHTML="No exams yet"

return

}

data.forEach(e=>{

const div=document.createElement("div")

div.className="recent-item"

div.innerHTML=`

<b>${e.title}</b><br>

<button onclick="location.href='exam.html?id=${e.id}'">
Open
</button>

<button onclick="viewResults('${e.id}')">
Results
</button>

`

container.appendChild(div)

})

}catch(err){

console.error(err)

container.innerHTML="Unable to load exams"

}

}


/* =========================
View Results
========================= */

window.viewResults = function(examId){

localStorage.setItem("results_exam",examId)

location.href="teacher-results.html"

}


/* =========================
Dashboard Init
========================= */

function initDashboard(){

setTimeout(()=>{
loadRecentExams()
},100)

}


/* =========================
Init
========================= */

initDashboard()

</script>


<!-- =========================
Eruda Debug Console
(remove in production)
========================= -->

<script src="https://cdn.jsdelivr.net/npm/eruda"></script>

<script>
eruda.init()
</script>


</body>
</html>

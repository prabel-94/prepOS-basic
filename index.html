<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>PrepOS Home</title>

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<h1>PrepOS</h1>
<div class="small">Teacher Console</div>

<div class="card">
<h3>Create Exam</h3>
<p>Paste questions, clean with QCP, generate exam link.</p>
<button onclick="location.href='exam-creator.html'">Open Creator</button>
</div>

<div class="card">
<h3>Draft Editor</h3>
<p>Create and manage draft exams.</p>
<button onclick="createDraft()">New Draft</button>
</div>

<div class="card">
<h3>Recent Exams</h3>
<div id="recentExams">Loading…</div>
</div>

<div class="card">
<h3>Results Viewer</h3>
<p>Browse submissions by exam.</p>
<button onclick="location.href='teacher-results.html'">Open Viewer</button>
</div>

<div class="card">
<h3>Open Exam</h3>
<p>Preview exam using id.</p>

<input
id="examId2"
placeholder="Paste exam id"
style="width:100%;padding:8px;margin-top:6px;"
>

<button onclick="openExam()">Open Exam</button>

</div>


<!-- =========================
Scripts
========================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/config.js"></script>

<script>

const supabase = window.supabase.createClient(
SUPABASE_URL,
SUPABASE_ANON_KEY
)

/* =========================
Open Exam
========================= */

function openExam(){

const id=document.getElementById("examId2").value.trim()

if(!id) return alert("Enter exam id")

location.href=`exam.html?id=${id}`

}

/* =========================
Create Draft (NEW)
========================= */

async function createDraft(){

const { data, error } = await supabase
.from("exam_drafts")
.insert([
{
title:"Untitled Draft",
duration:60,
schema_json:{ questions:[] },
status:"draft"
}
])
.select()
.single()

if(error){

console.error("Draft creation failed",error)
alert("Failed to create draft")

return

}

location.href=`draft.html?id=${data.id}`

}

/* =========================
Recent Exams
========================= */

async function loadRecentExams(){

const res = await fetch(
`${SUPABASE_URL}/rest/v1/exam_sessions?select=id,title,created_at&order=created_at.desc&limit=5`,
{
headers:{
apikey:SUPABASE_ANON_KEY,
Authorization:`Bearer ${SUPABASE_ANON_KEY}`
}
})

if(!res.ok){

console.error("Failed to load exams",res.status)

document.getElementById("recentExams").innerText="Failed to load exams"

return

}

const data = await res.json()

const container=document.getElementById("recentExams")

container.innerHTML=""

if(!data.length){

container.innerHTML="No exams yet"

return

}

data.forEach(e=>{

const div=document.createElement("div")

div.className="recent-item"

div.innerHTML=`
<b>${e.title}</b><br>
<button onclick="location.href='exam.html?id=${e.id}'">Open</button>
<button onclick="viewResults('${e.id}')">Results</button>
`

container.appendChild(div)

})

}

/* =========================
Results
========================= */

function viewResults(examId){

localStorage.setItem("results_exam",examId)

location.href="teacher-results.html"

}

loadRecentExams()

</script>

</body>
</html>

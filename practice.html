<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="assets/prepos-icon.png">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Practice</title>

  <link rel="stylesheet" href="css/style.css" />
</head>

<body>

<div id="app-nav-root"></div>

<div class="container">

  <!-- HEADER -->
  <div class="exam-header hidden">
    <h2>Practice</h2>
  </div>

  <div class="practice-mode-grid mt-20" role="group" aria-label="Practice mode">
    <button
      id="generatorModeBtn"
      class="practice-mode-card active"
      type="button"
      data-mode="generator"
    >
      <span class="practice-mode-title">Generator Practice</span>
      <span class="practice-mode-sub">Practice with smart generated questions.</span>
    </button>

    <button
      id="bankModeBtn"
      class="practice-mode-card"
      type="button"
      data-mode="bank"
    >
      <span class="practice-mode-title">Question Bank Practice</span>
      <span class="practice-mode-sub">Practice saved questions from the bank.</span>
    </button>
  </div>

  <!-- CONTROLS -->
  <div class="control-bar mt-20">

    <div id="generatorControls" class="practice-control-group">
      <select id="subjectSelect">
        <option value="malayalam">Malayalam</option>
        <option value="english">English</option>
      </select>

      <select id="patternSelect">
        <option value="SYNONYM">Synonym</option>
        <option value="OPPOSITE_WORD">Opposite</option>
      </select>

      <label class="toggle-row">
        <input id="adaptiveToggle" type="checkbox" checked>
        <span>Adaptive Mode</span>
      </label>
      <p class="small text-muted practice-adaptive-hint">
        Off: synonym prompts are random. On: primary word first, then random after familiarity.
      </p>
    </div>

  <div id="bankControls" class="practice-control-group hidden">
    <select id="bankTopicSelect">
      <option value="">All Topics</option>
    </select>

    <select id="bankOrderSelect">
      <option value="random" selected>Random Bank Questions</option>
      <option value="latest">Latest Bank Questions</option>
    </select>

    <button
      type="button"
      id="practiceAssistanceToggle"
      class="exam-assistance-toggle hidden"
      aria-pressed="false"
      title="Optional Malayalam help mask — English is default. Applies to all bank questions unless you override on a card."
    >
      മലയാളം
    </button>
  </div>

    <select id="sessionLimitSelect">
      <option value="0">Unlimited</option>
      <option value="5">5 Questions</option>
      <option value="10" selected>10 Questions</option>
      <option value="20">20 Questions</option>
    </select>

    <button id="startBtn" class="primary-btn">
      Start Practice
    </button>

  </div>

  <div id="practiceStatus" class="practice-status hidden"></div>
  <div id="practiceProgress" class="practice-progress hidden"></div>
  <div
    id="practiceProgressBar"
    class="practice-progress-bar hidden"
    role="progressbar"
    aria-valuemin="0"
    aria-valuemax="100"
    aria-valuenow="0"
  >
    <div id="practiceProgressFill" class="practice-progress-fill"></div>
  </div>

  <!-- QUESTION AREA -->
  <div id="practiceArea" class="mt-30 hidden">

    <div id="questionCard" class="practice-question-card">
      <div id="questionPrompt"></div>
      <div class="practice-options-wrap">
        <div id="optionsContainer" class="practice-options options"></div>
        <div
          id="practiceOptionShield"
          class="practice-option-shield hidden"
          aria-hidden="true"
        >
          <span id="practiceOptionShieldText" class="practice-option-shield-text"></span>
        </div>
      </div>
    </div>

    <div id="feedback" class="practice-feedback mt-20" aria-live="polite" aria-atomic="true">
      <div id="feedbackVerdict" class="practice-feedback-verdict hidden"></div>
      <div id="feedbackExplanation" class="practice-feedback-explanation hidden"></div>
    </div>

    <div id="sessionSummary" class="practice-session-summary hidden"></div>

    <button id="nextBtn" class="primary-btn mt-20 hidden">
      Next Question
    </button>

  </div>

</div>

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/config.js?v=20260520"></script>
<script type="module" src="js/auth.js"></script>
<script type="module" src="js/practice.js"></script>

</body>
</html>

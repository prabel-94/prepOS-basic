<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>PrepOS Draft Editor</title>


</head>

<body>

<h2>Draft Editor</h2>

<label for="title">Title</label>
<input id="title" type="text" placeholder="Enter title"/>


<!-- ===================== -->
<!-- LOGO SECTION -->
<!-- ===================== -->

<div class="logo-section">

<label>Exam Logo (optional)</label>

<input
type="file"
id="logoUpload"
accept="image/png,image/jpeg,image/jpg,image/svg+xml"
/>

<img id="logoPreview">

</div>


<label for="duration">Duration (minutes)</label>

<input
id="duration"
type="number"
placeholder="Enter duration in minutes"
/>


<!-- ===================== -->
<!-- Workspace -->
<!-- ===================== -->

<div class="workspace">

<!-- ===================== -->
<!-- Draft Area -->
<!-- ===================== -->

<div class="draft-area">

<div class="draft-header">

<h3>Questions</h3>

<button id="openQuestionBankBtn">
Add from Question Bank
</button>

</div>

<div id="questions"></div>

</div>


<!-- ===================== -->
<!-- Question Bank Panel -->
<!-- ===================== -->

<div class="question-bank-panel" id="questionBankPanel">

<div class="qb-header">

<button id="closeQB">← Back</button>

<h3>Question Bank</h3>

</div>

<input
type="text"
id="topicSearch"
placeholder="Search topics..."
/>

<div id="questionBankResults">

<!-- Placeholder Example -->

<div class="qb-question">

<span>Which amendment added Socialist and Secular?</span>

<button>Insert</button>

</div>

</div>

</div>

</div>


<!-- ===================== -->
<!-- Draft Actions -->
<!-- ===================== -->

<div class="draft-actions">

<button onclick="saveDraft()">Save Draft</button>

<button onclick="cloneDraft()">Clone</button>

<button onclick="publishDraft()">Publish Exam</button>

</div>


<div id="status"></div>


<!-- ===================== -->
<!-- Scripts -->
<!-- ===================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/config.js"></script>

<script src="js/draft.js"></script>


<!-- =====================
Question Bank Toggle
===================== -->

<script>

const openQBBtn = document.getElementById("openQuestionBankBtn");
const qbPanel = document.getElementById("questionBankPanel");
const closeQB = document.getElementById("closeQB");

openQBBtn.onclick = function(){

  qbPanel.classList.toggle("active");

};

closeQB.onclick = function(){

  qbPanel.classList.remove("active");

};

</script>


<!-- =====================
Debug Console
===================== -->

<script>
(function(){
  var script=document.createElement('script');
  script.src="https://cdn.jsdelivr.net/npm/eruda";
  script.onload=function(){
    eruda.init();
  };
  document.body.appendChild(script);
})();
</script>


</body>
</html>

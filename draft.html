<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PrepOS Draft Editor</title>

<link rel="stylesheet" href="css/style.css">

</head>


<body class="draft-page">

<main class="draft-wrapper">

<h2>Draft Editor</h2>


<!-- ======================
Draft Metadata
====================== -->

<section class="draft-meta">

<label for="title">Title</label>
<input
id="title"
type="text"
placeholder="Enter title"
/>

<label for="duration">Duration (minutes)</label>
<input
id="duration"
type="number"
placeholder="Enter duration in minutes"
/>

</section>



<!-- ======================
Logo Upload
====================== -->

<section class="logo-section">

<label>Exam Logo (optional)</label>

<input
type="file"
id="logoUpload"
accept="image/png,image/jpeg,image/jpg,image/svg+xml"
/>

<img id="logoPreview" alt="Logo preview">

</section>



<!-- ======================
Workspace
====================== -->

<section class="workspace">


<!-- ======================
Draft Area
====================== -->

<div class="draft-area">

<div class="draft-header">

<h3>Questions</h3>

<div class="draft-toolbar">

<button type="button" id="newQuestionBtn">
+ New Question
</button>

<button type="button" id="openQuestionBankBtn">
+ Add from Question Bank
</button>

</div>

</div>


<div id="questions">

<p class="small">
No questions yet. Click "New Question" to start.
</p>

</div>

</div>



<!-- ======================
Question Bank Panel
====================== -->

<aside
class="question-bank-panel"
id="questionBankPanel"
>

<div class="qb-header">

<button type="button" id="closeQB">← Back</button>

<h3>Question Bank</h3>

</div>


<input
type="text"
id="qbSearch"
placeholder="Search questions..."
>


<div id="questionBankResults">

<div class="qb-loading">
Search questions to begin
</div>

</div>

</aside>


</section>



<!-- ======================
Draft Actions
====================== -->

<section class="draft-actions">

<button type="button" onclick="saveDraft()">
Save Draft
</button>

<button type="button" onclick="cloneDraft()">
Clone
</button>

<button type="button" onclick="publishDraft()">
Publish Exam
</button>

</section>

<div id="status"></div>

</main>



<!-- ======================
Scripts
====================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/config.js"></script>
<script src="js/draft.js"></script>



<!-- ======================
Debug Console (Dev Only)
====================== -->

<script>
(function(){
  var script=document.createElement('script');
  script.src="https://cdn.jsdelivr.net/npm/eruda";
  script.onload=function(){
    eruda.init();
  };
  document.body.appendChild(script);
})();
</script>

</body>
</html>

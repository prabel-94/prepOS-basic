<!DOCTYPE html>
<html lang="en">

<head>

<link rel="icon" type="image/png" href="assets/prepos-icon.png">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PrepOS Draft Editor</title>

<link rel="stylesheet" href="css/style.css">

</head>

<body class="draft-page">

<main class="draft-wrapper container">

<!-- ======================
HEADER
====================== -->
<header class="draft-title">

<h2>Draft Editor</h2>

<div id="status" class="save-status"></div>

</header>


<!-- ======================
DRAFT META
====================== -->
<section class="draft-meta mt-20">

<label for="title">Title</label>
<input id="title" type="text" placeholder="Enter title" />

<label for="duration">Duration (minutes)</label>
<input id="duration" type="number" placeholder="Enter duration in minutes" />

</section>


<!-- ======================
LOGO
====================== -->
<section class="logo-section mt-20">

<label for="logoUpload">Exam Logo (optional)</label>

<input
type="file"
id="logoUpload"
accept="image/png,image/jpeg,image/jpg,image/svg+xml"
/>

<img id="logoPreview" alt="Logo preview" style="display:none">

</section>


<!-- ======================
WORKSPACE
====================== -->
<section class="workspace mt-20">

<!-- ======================
DRAFT AREA
====================== -->
<div class="draft-area">

<div class="draft-header">

<h3>Questions</h3>

<div class="draft-toolbar">

<button type="button" id="newQuestionBtn" disabled>
+ New Question
</button>

<button type="button" id="openQuestionBankBtn">
+ Add from Bank
</button>

<button type="button" id="saveAllToBankBtn">
Save All to Bank
</button>

</div>

</div>

<!-- QUESTIONS -->
<div id="questions">

<div class="loading">
Loading draft...
</div>

</div>

</div>


<!-- ======================
QUESTION BANK PANEL
====================== -->
<aside class="question-bank-panel hidden" id="questionBankPanel">

<div class="qb-header">

<button type="button" id="closeQB">
← Back
</button>

<h3>Question Bank</h3>

</div>

<!-- SEARCH -->
<input
type="text"
id="qbSearch"
placeholder="Search questions..."
class="mt-20"
/>

<!-- RESULTS -->
<div id="questionBankResults" class="mt-20">

<div class="qb-loading">
Search questions to begin
</div>

</div>

</aside>

</section>


<!-- ======================
DRAFT ACTIONS
====================== -->
<section class="draft-actions mt-20">

<section class="publish-result mt-20">
  <div id="examLink" class="question-card" style="display:none"></div>
</section>

<button type="button" onclick="saveDraft()">
Save Draft
</button>

<button type="button" onclick="cloneDraft()">
Clone
</button>

<button type="button" onclick="publishDraft()">
Publish Exam
</button>

</section>

</main>


<!-- ======================
SCRIPTS
====================== -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/config.js"></script>
<script src="js/draft.js"></script>


<!-- ======================
DEV DEBUG (REMOVE IN PROD)
====================== -->
<script>
(function(){
  var script=document.createElement('script');
  script.src="https://cdn.jsdelivr.net/npm/eruda";
  script.onload=function(){
    eruda.init();
  };
  document.body.appendChild(script);
})();
</script>

</body>
</html>

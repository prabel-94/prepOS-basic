<!DOCTYPE html>
<html lang="en">

<head>

<link rel="icon" type="image/png" href="assets/prepos-icon.png">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PrepOS Draft Editor</title>

<link rel="stylesheet" href="css/style.css">

</head>

<body class="draft-page">

<main class="container draft-wrapper">

<!-- ======================
HEADER
====================== -->
<header class="draft-title">

  <h2>Draft Editor</h2>
  <div id="status" class="save-status"></div>

</header>


<!-- ======================
DRAFT META
====================== -->
<section class="draft-meta mt-20">

  <div class="form-group">
    <label for="title">Title</label>
    <input id="title" name="title" type="text" placeholder="Enter title" />
  </div>

  <div class="form-group">
    <label for="duration">Duration (minutes)</label>
    <input id="duration" name="duration" type="number" placeholder="Enter duration in minutes" />
  </div>

</section>


<!-- ======================
LOGO
====================== -->
<section class="logo-section mt-20">

  <label for="logoUpload">Exam Logo (optional)</label>

  <input
    type="file"
    id="logoUpload"
    name="logo"
    accept="image/png,image/jpeg,image/jpg,image/svg+xml"
  />

  <img id="logoPreview" alt="Logo preview" class="hidden">

</section>


<!-- ======================
WORKSPACE
====================== -->
<section class="workspace mt-20">

  <!-- ======================
  DRAFT AREA
  ====================== -->
  <div class="draft-area">

    <!-- HEADER -->
    <div class="draft-header">

      <h3>Questions</h3>

      <div class="draft-toolbar">

        <button type="button" id="newQuestionBtn" class="primary-btn">
          + New Question
        </button>

        <button type="button" id="openQuestionBankBtn" class="secondary-btn">
          + Add from Bank
        </button>

        <button type="button" id="saveAllToBankBtn" class="secondary-btn">
          Save All to Bank
        </button>

      </div>

    </div>

    <!-- QUESTIONS CONTAINER -->
    <div id="questions" class="question-list">

      <div class="loading">
        Loading draft...
      </div>

    </div>

  </div>


  <!-- ======================
  QUESTION BANK PANEL
  ====================== -->
  <aside class="question-bank-panel hidden" id="questionBankPanel">

    <div class="qb-header">
      <button type="button" id="closeQB">← Back</button>
      <h3>Question Bank</h3>
    </div>

    <!-- SEARCH -->
    <input
      type="text"
      id="qbSearch"
      name="qb_search"
      placeholder="Search questions..."
      class="mt-20"
    />
    <div class="mt-20">
    
      <input type="text" id="topicSearch" placeholder="Search by topic..." />
    
      <div id="topicDropdown" class="topic-tags mt-10 hidden"></div>
    
    </div>
    <div class="form-group mt-20">

  <label for="topicSearch">Search by Topic</label>

  <input
    type="text"
    id="topicSearch"
    placeholder="Type topic (e.g., preamble)"
  />

</div>

<div id="topicDropdown" class="topic-tags mt-10 hidden"></div>
    <!-- RESULTS -->
    <div id="questionBankResults" class="mt-20">

      <div class="qb-loading">
        Search questions to begin
      </div>

    </div>

  </aside>

</section>

<aside class="question-bank-panel hidden" id="addToBankPanel">

  <div class="qb-header">
    <button type="button" id="closeAddToBank">← Back</button>
    <h3>Add to Question Bank</h3>
  </div>

  <div class="mt-20">

    <div id="bankQuestionPreview" class="question-card"></div>

    <input
      type="text"
      id="bankTopicInput"
      placeholder="Add topic..."
      class="mt-20"
    />

    <div id="bankTopicTags" class="topic-tags mt-10"></div>

    <button id="confirmAddToBank" class="primary-btn w-full mt-20">
      Save to Bank
    </button>

  </div>
  <div id="duplicateBox" class="hidden mt-20">

  <div class="status duplicate">
    Duplicate question found ⚠️
  </div>

  <div class="mt-10 small">
    This question already exists in the question bank.
  </div>

  <div class="flex gap-10 mt-20">
    <button id="useExistingBtn" class="secondary-btn w-full">
      Use Existing
    </button>

    <button id="createNewBtn" class="primary-btn w-full">
      Create New
    </button>
  </div>

</div>

</aside>


<!-- ======================
DRAFT ACTIONS
====================== -->
<section class="draft-actions mt-20">

  <div class="publish-result mt-20">
    <div id="examLink" class="question-card hidden"></div>
  </div>

  <div class="actions-row">

    <button type="button" id="saveDraftBtn" class="secondary-btn">
      Save Draft
    </button>

    <button type="button" id="publishDraftBtn" class="primary-btn">
      Publish Exam
    </button>

  </div>

</section>

</main>


<!-- ======================
SCRIPTS
====================== -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/config.js"></script>
<script src="js/draft.js"></script>

<script>
// EVENT BINDING (UI → Logic separation)
document.getElementById("saveDraftBtn")?.addEventListener("click", saveDraft);
document.getElementById("publishDraftBtn")?.addEventListener("click", publishDraft);
</script>


<!-- ======================
DEV DEBUG (REMOVE IN PROD)
====================== -->

  var script=document.createElement('script');

  script.onload=function(){
    eruda.init();
  };
  document.body.appendChild(script);
})();
</script>

</body>
</html>

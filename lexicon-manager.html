<!DOCTYPE html>
<html lang="en">
<head>

  <link rel="icon" type="image/png" href="assets/prepos-icon.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PrepOS Lexicon Manager</title>

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="container">

  <div class="exam-header">
    <div class="exam-header-right">
      <h2>Lexicon Manager</h2>
      <div id="lexiconStatus" class="exam-subtitle">
        Manage generator word groups
      </div>
    </div>

    <button
      type="button"
      class="secondary-btn"
      onclick="location.href='qb-manager.html'"
    >
      Back
    </button>
  </div>

  <div class="control-bar mt-20">
    <select id="groupSearchSelect" style="display:none;">
  <option value="">Select Group</option>
</select>
    <select id="modeSelect">
  <option value="SESSION">Session Entry</option>
  <option value="BROWSE">Browse & Edit</option>
</select>
    <select id="patternSelect">
      <option value="SYNONYM">Synonym</option>
      <option value="OPPOSITE_WORD">Opposite</option>
    </select>

    <select id="languageSelect">
      <option value="ml">Malayalam</option>
      <option value="en">English</option>
    </select>

    <input
  type="text"
  id="topicInput"
  class="topic-input"
  placeholder="Topic"
  value="vocabulary"
/>

    <button type="button" id="addGroupBtn" class="primary-btn">
      + Add Word Group
    </button>
  </div>

  <div class="lexical-class-guide mt-20 question-card">

  <div class="small mb-10">
    Lexical Classes
  </div>

  <div class="flex gap-10 wrap">

    <span class="tag">ABSTRACT</span>
    <span class="tag">EMOTION</span>
    <span class="tag">STATE</span>
    <span class="tag">QUALITY</span>
    <span class="tag">ACTION</span>
    <span class="tag">OBJECT</span>
    <span class="tag">PLACE</span>
    <span class="tag">COLLECTIVE</span>
    <span class="tag">TITLE</span>
    <span class="tag">PERSON_NEUTRAL</span>
    <span class="tag">PERSON_MALE</span>
    <span class="tag">PERSON_FEMALE</span>

  </div>

</div>

<div id="groupsContainer" class="lexicon-groups mt-20"></div>
  <!-- =========================================
ANTONYM LINKER
========================================= -->

<div class="relation-builder mt-20">

  <h3>Link Opposites</h3>

  <div class="relation-columns">

    <!-- GROUP A -->
    <div class="group-panel">
      <div class="small">Group A</div>
      <div id="groupA-list" class="group-list"></div>
    </div>

    <!-- GROUP B -->
    <div class="group-panel">
      <div class="small">Group B</div>
      <div id="groupB-list" class="group-list"></div>
    </div>

  </div>

  <div class="mt-10">
    <button id="link-opposite-btn" class="primary-btn">
      🔗 Link as Opposite
    </button>
  </div>

</div>

</div>

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- Config -->
<script src="js/config.js?v=20260520"></script>

<!-- Lexicon Manager -->
<script type="module" src="js/lexicon-manager.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="assets/prepos-icon.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Topic Note</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .canonical-meta {
      font-size: 0.875rem;
      color: #64748b;
      margin-top: 4px;
    }
    #representationTabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 20px 0;
      border-bottom: 1px solid #e2e8f0;
      padding-bottom: 12px;
    }
    .canonical-tab {
      padding: 8px 16px;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      background: #f8fafc;
      cursor: pointer;
      font-size: 0.9rem;
    }
    .canonical-tab.active {
      background: #1e293b;
      color: #fff;
      border-color: #1e293b;
    }
    #noteContent {
      line-height: 1.65;
      font-size: 1rem;
    }
    .canonical-representation {
      max-width: 720px;
    }
    .canonical-block,
    .canonical-block.collapsible {
      margin-bottom: 16px;
    }
    .canonical-block-heading {
      margin: 0 0 8px;
      font-weight: 600;
    }
    .canonical-paragraph {
      margin: 0 0 12px;
    }
    .canonical-list {
      margin: 0 0 16px 1.25rem;
    }
    .topic-link {
      color: var(--primary);
      text-decoration: none;
      font-weight: 500;
      cursor: pointer;
    }
    .topic-link:hover {
      text-decoration: underline;
    }
    .topic-link.unresolved {
      opacity: 0.65;
      cursor: default;
      text-decoration: none;
    }
    .topic-link.unresolved:hover {
      text-decoration: none;
    }
    details.collapsible summary {
      cursor: pointer;
      font-weight: 600;
      padding: 8px 0;
    }
    .canonical-block-body {
      padding-left: 8px;
      border-left: 3px solid #e2e8f0;
      margin-top: 8px;
    }
    .canonical-empty {
      color: #64748b;
      font-style: italic;
    }
    #readerStatus {
      margin-top: 12px;
      color: #64748b;
    }
    #readerStatus.error {
      color: #b91c1c;
    }
    .hidden {
      display: none !important;
    }
    .draft-badge {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #92400e;
      background: #fef3c7;
      border: 1px solid #fcd34d;
      border-radius: 4px;
      padding: 2px 8px;
      margin-right: 10px;
    }
    .draft-meta {
      margin-top: 8px;
      font-size: 0.875rem;
      color: #64748b;
      display: flex;
      flex-wrap: wrap;
      gap: 8px 16px;
      align-items: center;
    }
    #noteDraftToolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 16px 0 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid #e2e8f0;
    }
    #noteDraftToolbar .secondary-btn.is-active,
    #noteDraftToolbar .primary-btn.is-active {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
    }
    #noteSourcePanel {
      margin-bottom: 20px;
      max-width: 720px;
    }
    #noteSourcePanel label {
      display: block;
      font-size: 0.875rem;
      font-weight: 600;
      color: #475569;
      margin-bottom: 8px;
    }
    #semanticSourceEditor {
      width: 100%;
      min-height: 360px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 14px;
      line-height: 1.55;
      padding: 12px;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      resize: vertical;
      box-sizing: border-box;
    }
    @media (max-width: 640px) {
      #semanticSourceEditor {
        min-height: 280px;
      }
      #noteDraftToolbar {
        gap: 8px;
      }
      #noteDraftToolbar button {
        flex: 1 1 calc(50% - 8px);
        min-width: 0;
      }
    }
    .referenced-in {
      max-width: 720px;
      margin-top: 32px;
      padding-top: 20px;
      border-top: 1px solid #e2e8f0;
    }
    .referenced-in-heading {
      margin: 0 0 12px;
      font-size: 0.95rem;
      font-weight: 600;
      color: #475569;
      letter-spacing: 0.02em;
    }
    .referenced-in-list {
      list-style: none;
      margin: 0;
      padding: 0;
    }
    .referenced-in-list li {
      margin: 0 0 6px;
      padding-left: 0.75rem;
      position: relative;
    }
    .referenced-in-list li::before {
      content: "•";
      position: absolute;
      left: 0;
      color: #94a3b8;
    }
    .referenced-in-link {
      font-weight: 500;
    }
    .structural-hierarchy {
      max-width: 720px;
    }
    .structural-group {
      margin-bottom: 0.35rem;
      padding-left: calc(var(--structural-depth, 0) * 0.85rem);
    }
    .structural-toggle {
      width: 100%;
      text-align: left;
      border: none;
      background: transparent;
      font-weight: 600;
      cursor: pointer;
      padding: 0.5rem 0;
      font-size: 1rem;
      line-height: 1.4;
      color: #1e293b;
      display: flex;
      align-items: flex-start;
      gap: 0.35rem;
      min-height: 44px;
    }
    .structural-toggle:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
      border-radius: 4px;
    }
    .structural-indicator {
      flex-shrink: 0;
      width: 1.1rem;
      color: #64748b;
      font-size: 0.85rem;
      line-height: 1.5;
    }
    .structural-heading {
      flex: 1;
    }
    .structural-content {
      padding: 0 0 0.75rem 1.25rem;
      border-left: 2px solid #e2e8f0;
      margin-left: 0.55rem;
    }
    .structural-content.collapsed {
      display: none;
    }
    .structural-content .canonical-list {
      margin-top: 0.25rem;
      margin-bottom: 0.5rem;
    }
    .structural-orphan-content {
      margin-bottom: 1rem;
    }
    @media (max-width: 640px) {
      .structural-toggle {
        padding: 0.6rem 0;
      }
      .structural-content {
        padding-left: 0.85rem;
      }
    }
  </style>
</head>
<body>

<div id="app-nav-root"></div>

<div class="container">

  <div class="exam-header" id="noteHeader">
    <h2>Topic Note</h2>
    <div class="exam-subtitle">Canonical knowledge reader</div>
  </div>

  <div id="noteDraftToolbar" class="hidden" aria-label="Draft workspace actions"></div>

  <div id="representationTabs" role="tablist" aria-label="Representations"></div>

  <div id="noteSourcePanel" class="hidden">
    <label for="semanticSourceEditor">Semantic markdown source</label>
    <textarea id="semanticSourceEditor" spellcheck="false" aria-label="Semantic markdown source"></textarea>
  </div>

  <div id="noteContent"></div>

  <div id="noteBacklinks"></div>

  <div id="readerStatus">Loading…</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js?v=20260520"></script>
<script type="module" src="js/auth.js"></script>
<script type="module" src="js/notes/note-reader.js?v=20260605"></script>

</body>
</html>

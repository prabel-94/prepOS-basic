<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="assets/prepos-icon.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Topic Note</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/note-reader.css">
</head>
<body class="note-reader-page">

<div id="app-nav-root"></div>

<div class="container">

  <div class="exam-header" id="noteHeader">
    <h2>Topic Note</h2>
    <div class="exam-subtitle">Canonical knowledge reader</div>
  </div>

  <div id="languageTabs" class="language-tabs hidden" role="navigation" aria-label="Language variants"></div>

  <div id="noteDraftToolbar" class="hidden" aria-label="Draft workspace actions"></div>

  <div id="noteSectionInventory" class="hidden" aria-label="Note sections"></div>

  <div id="representationTabs" role="tablist" aria-label="Representations"></div>

  <div id="noteSourcePanel" class="hidden">
    <label for="semanticSourceEditor">Semantic markdown source</label>
    <textarea id="semanticSourceEditor" spellcheck="false" aria-label="Semantic markdown source"></textarea>
  </div>

  <div id="noteContentWrap" class="note-content-wrap">
    <div id="noteContent"></div>
  </div>

  <div id="noteVersionHistory" class="hidden" aria-label="Archived versions"></div>

  <div id="noteBacklinks"></div>

  <div id="readerStatus"><div id="noteReaderSkeleton"></div></div>

</div>

<div id="noteLayerFlip" class="note-layer-flip hidden" aria-label="Section language flip">
  <button type="button" class="note-layer-flip-btn" data-layer-flip-toggle>
    മലയാളം
  </button>
  <span class="note-layer-flip-hint" data-layer-flip-hint></span>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js?v=20260520"></script>
<script type="module" src="js/auth.js"></script>
<script type="module" src="js/notes/note-reader.js?v=20260701"></script>

</body>
</html>

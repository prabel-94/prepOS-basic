<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="assets/prepos-icon.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Exam</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .creator-option {
      background: var(--card);
      padding: 16px;
      margin-top: 12px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      cursor: pointer;
      box-shadow: var(--shadow);
    }

    .creator-option:hover {
      background: #eef2ff;
    }
  </style>
</head>

<body class="pro-surface">

<div id="app-nav-root"></div>

<div class="container">
  <div class="card mt-30">
    <div class="h2">Choose how to create</div>

    <div class="creator-option" data-action="parser">
      📄 Upload / Paste Questions (Use Parser)
    </div>

    <div class="creator-option" data-action="manual">
      ✍️ Start from Scratch (Manual Entry)
    </div>
  </div>
</div>

<script src="js/config.js?v=20260520"></script>
<script type="module" src="js/auth.js"></script>
<script type="module" src="js/creator-mode.js"></script>

</body>
</html>

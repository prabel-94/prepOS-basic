<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PrepOS Question Bank Manager</title>

<link rel="stylesheet" href="css/styles.css">

</head>

<body>

<div class="container">

  <!-- =========================
       HEADER
  ========================== -->
  <div class="exam-header">
    <div class="exam-header-right">
      <h2>Question Bank Manager</h2>
      <div class="exam-subtitle">
        Manage your knowledge system
      </div>
    </div>
  </div>

  <!-- =========================
       OVERVIEW (UPGRADED)
  ========================== -->
  <div class="overview-grid mt-20">

    <div class="stat-card">
      <div id="total-questions" class="stat-value">0</div>
      <div class="stat-label">Questions</div>
    </div>

    <div class="stat-card">
      <div id="total-topics" class="stat-value">0</div>
      <div class="stat-label">Topics</div>
    </div>

    <div class="stat-card">
      <div id="avg-per-topic" class="stat-value">0</div>
      <div class="stat-label">Avg / Topic</div>
    </div>

    <div class="stat-card">
      <div id="weak-topics" class="stat-value">0</div>
      <div class="stat-label">Weak Topics</div>
    </div>

  </div>

  <!-- =========================
       CONTROL BAR (STRUCTURED)
  ========================== -->
  <div class="control-bar">

    <!-- LEFT: SEARCH + FILTER -->
    <div class="flex gap-10 w-full">
      <input 
        id="search-input" 
        placeholder="Search questions..." 
        class="w-full" 
      />

      <select id="topic-filter"></select>
    </div>

    <!-- RIGHT: VIEW TOGGLE -->
    <div class="flex gap-10">
      <button id="view-questions" class="primary-btn">Questions</button>
      <button id="view-topics" class="secondary-btn">Topics</button>
    </div>

    <!-- PRIMARY ACTION -->
    <button id="add-question-btn" class="primary-btn">
      + Add
    </button>

  </div>

  <!-- =========================
       MAIN WORKSPACE (NEW)
  ========================== -->
  <div class="manager-workspace">

    <!-- =====================
         LEFT: LIST AREA
    ====================== -->
    <div class="list-area">

      <!-- QUESTIONS -->
      <div id="questions-view"></div>

      <!-- TOPICS -->
      <div id="topics-view" class="hidden"></div>

    </div>

    <!-- =====================
         RIGHT: FORM AREA
    ====================== -->
    <div class="form-area hidden" id="question-form">

      <div class="question-card">

        <h3>Add / Edit Question</h3>

        <textarea 
          id="question-text"
          placeholder="Enter question"
        ></textarea>

        <input id="optA" placeholder="Option A">
        <input id="optB" placeholder="Option B">
        <input id="optC" placeholder="Option C">
        <input id="optD" placeholder="Option D">

        <select id="correct-option">
          <option value="A">Correct: A</option>
          <option value="B">Correct: B</option>
          <option value="C">Correct: C</option>
          <option value="D">Correct: D</option>
        </select>

        <textarea 
          id="explanation"
          placeholder="Explanation (optional)"
        ></textarea>

        <!-- TOPIC INPUT -->
        <input 
          id="topic-input"
          placeholder="Enter topics (comma separated)"
        />

        <div id="topicWarnings" class="topic-warnings"></div>

        <div class="flex gap-10 mt-10">
          <button id="save-question-btn" class="primary-btn">
            Save Question
          </button>

          <button onclick="resetForm()">
            Cancel
          </button>
        </div>

      </div>

    </div>

  </div>

</div>

<!-- =========================
     SCRIPTS
========================== -->

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- Config -->
<script src="js/config.js"></script>

<!-- QB Manager -->
<script src="js/qb-manager.js"></script>

<!-- Debug Console -->
<script src="https://cdn.jsdelivr.net/npm/eruda"></script>
<script>
  eruda.init();
</script>

</body>
</html>

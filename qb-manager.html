<!DOCTYPE html>
<html lang="en">
<head>

  <link rel="icon" type="image/png" href="assets/prepos-icon.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PrepOS Question Bank Manager</title>

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<div id="app-nav-root"></div>

<div class="container">

  <!-- =========================
       HEADER
  ========================== -->
  <div class="exam-header">

    <div class="exam-header-right">
      <h2>Question Bank Manager</h2>
      <div class="exam-subtitle">
        Manage your knowledge system
      </div>
    </div>

    <!-- PRIMARY ACTION -->
    <div>
      <button 
        class="primary-btn"
        onclick="location.href='draft.html'"
      >
        + Create from Draft
      </button>
    </div>

  </div>

  <div id="qb-status" class="qb-status hidden" role="status" aria-live="polite"></div>

  <!-- =========================
       OVERVIEW
  ========================== -->
  <div class="overview-grid mt-20">

    <div class="stat-card">
      <div id="total-questions" class="stat-value">0</div>
      <div class="stat-label">Questions</div>
    </div>

    <div class="stat-card">
      <div id="total-topics" class="stat-value">0</div>
      <div class="stat-label">Topics</div>
    </div>

    <div class="stat-card">
      <div id="avg-per-topic" class="stat-value">0</div>
      <div class="stat-label">Avg / Topic</div>
    </div>

    <div class="stat-card">
      <div id="weak-topics" class="stat-value">0</div>
      <div class="stat-label">Weak Topics</div>
    </div>

  </div>

  <!-- =========================
       CONTROL BAR
  ========================== -->
  <div class="control-bar">

    <!-- SEARCH + FILTER -->
    <div class="flex gap-10 w-full">
      <input 
        id="search-input" 
        placeholder="Search questions..." 
        class="w-full" 
      />
      <input 
  id="topic-search" 
  placeholder="Search topics..." 
  class="w-full"
/>


      <label for="topic-filter">Filter by Topic:</label>
      <select id="topic-filter"></select>
      <label for="ca-filter">Type:</label>
<select id="ca-filter">
  <option value="all">All</option>
  <option value="ca">Current Affairs</option>
  <option value="static">Static</option>
</select>
      <label for="ml-filter">Malayalam:</label>
<select id="ml-filter">
  <option value="all">All</option>
  <option value="ml-unverified">Needs review</option>
  <option value="ml-verified">Verified</option>
</select>
    </div>

    

    <!-- VIEW TOGGLE -->
    <div class="flex gap-10">
      <button id="view-questions" class="primary-btn">Questions</button>
      <button id="view-topics" class="secondary-btn">Topics</button>
    </div>
    <button id="openPatternManager" class="secondary-btn">
  Patterns
</button>

<button id="openCAManager" class="secondary-btn">
  CA Events
</button>

<button
  type="button"
  class="secondary-btn"
  onclick="location.href='lexicon-manager.html'"
>
  Lexicon
</button>

  </div>

  <!-- =========================
       MAIN WORKSPACE
  ========================== -->
  <div class="manager-workspace">

    <div class="list-area">

      <!-- QUESTIONS -->
      <div id="questions-view"></div>

      <!-- TOPICS -->
      <div id="topics-view" class="hidden"></div>

    </div>

  </div>

</div>

<!-- =========================
METADATA PANEL
========================= -->
<aside class="question-bank-panel prepos-side-panel prepos-side-panel-right hidden" id="metadataPanel">

  <div class="qb-header">
    <button id="closeMetadata">← Back</button>
    <h3>Edit Difficulty</h3>
  </div>

  <div class="mt-20">

    <div id="metaQuestionPreview" class="question-card small"></div>

    <!-- Cognitive -->
    <div class="mt-20">
      <b>Cognitive</b>
      <div class="flex gap-10 mt-10">
        <label><input type="radio" name="cognitive" value="recall"> Recall</label>
        <label><input type="radio" name="cognitive" value="concept"> Concept</label>
        <label><input type="radio" name="cognitive" value="application"> Application</label>
        <label><input type="radio" name="cognitive" value="analysis"> Analysis</label>
      </div>
    </div>

    <!-- Complexity -->
    <div class="mt-20">
      <b>Complexity</b>
      <div class="flex gap-10 mt-10">
        <label><input type="radio" name="complexity" value="simple"> Simple</label>
        <label><input type="radio" name="complexity" value="moderate"> Moderate</label>
        <label><input type="radio" name="complexity" value="complex"> Complex</label>
      </div>
    </div>

    <!-- Depth -->
    <div class="mt-20">
      <b>Depth</b>
      <div class="flex gap-10 mt-10">
        <label><input type="radio" name="depth" value="basic"> Basic</label>
        <label><input type="radio" name="depth" value="standard"> Standard</label>
        <label><input type="radio" name="depth" value="advanced"> Advanced</label>
      </div>
    </div>

    <button id="saveMetadataBtn" class="primary-btn w-full mt-20">
      Save Difficulty
    </button>
    
  </div>

</aside>

<aside class="question-bank-panel prepos-side-panel prepos-side-panel-right hidden" id="patternPanel">

  <div class="qb-header">
    <button id="closePattern">← Back</button>
    <h3>Edit Pattern</h3>
  </div>

  <div class="mt-20">

    <div id="patternQuestionPreview" class="question-card small"></div>

    <div class="mt-20">
  <b>Pattern</b>

  <div class="pattern-box">
    <input
      id="patternInput"
      class="w-full mt-10"
      placeholder="Enter pattern (optional)"
      autocomplete="off"
    />

    <div id="patternDropdown" class="pattern-dropdown hidden"></div>
  </div>

</div>

    <button id="savePatternBtn" class="primary-btn w-full mt-20">
      Save Pattern
    </button>

  </div>

</aside>

<aside class="question-bank-panel prepos-side-panel prepos-side-panel-right hidden" id="caPanel">

  <div class="qb-header">
    <button id="closeCA">← Back</button>
    <h3>Edit Current Affair</h3>
  </div>

  <div class="mt-20">

    <div id="caQuestionPreview" class="question-card small"></div>

    <div class="mt-20">
      <b>Event</b>
      <div class="pattern-box ca-box">
        <input
          id="caEventEdit"
          class="w-full mt-10"
          placeholder="Search CA events..."
          autocomplete="off"
        />
        <div id="caEventDropdown" class="pattern-dropdown hidden"></div>
      </div>
    </div>

    <div class="mt-20">
  <label for="caDateEdit"><b>Date</b></label>

  <input 
    id="caDateEdit"
    type="month"
    class="w-full mt-10"
  />
</div>

    <button id="saveCABtn" class="primary-btn w-full mt-20">
      Save CA
    </button>

  </div>

</aside>

<aside class="question-bank-panel prepos-side-panel prepos-side-panel-right hidden" id="editQuestionPanel">

  <div class="qb-header">
    <button id="closeEditQuestion" type="button">← Back</button>
    <h3>Edit Question</h3>
  </div>

  <div class="mt-20">

    <div class="mt-20">
      <label for="editQuestionText"><b>Question</b></label>
      <textarea
        id="editQuestionText"
        class="w-full mt-10"
        rows="4"
        placeholder="Question text"
      ></textarea>
    </div>

    <div class="mt-20">
      <label for="editOptionA"><b>Option A</b></label>
      <input id="editOptionA" class="w-full mt-10" type="text" />
    </div>

    <div class="mt-20">
      <label for="editOptionB"><b>Option B</b></label>
      <input id="editOptionB" class="w-full mt-10" type="text" />
    </div>

    <div class="mt-20">
      <label for="editOptionC"><b>Option C</b></label>
      <input id="editOptionC" class="w-full mt-10" type="text" />
    </div>

    <div class="mt-20">
      <label for="editOptionD"><b>Option D</b></label>
      <input id="editOptionD" class="w-full mt-10" type="text" />
    </div>

    <div class="mt-20">
      <b>Correct answer</b>
      <div class="flex gap-10 mt-10">
        <label><input type="radio" name="editCorrect" value="A"> A</label>
        <label><input type="radio" name="editCorrect" value="B"> B</label>
        <label><input type="radio" name="editCorrect" value="C"> C</label>
        <label><input type="radio" name="editCorrect" value="D"> D</label>
      </div>
    </div>

    <button id="saveQuestionBtn" class="primary-btn w-full mt-20" type="button">
      Save Question
    </button>

  </div>

</aside>

<div id="patternManagerPanel" class="question-bank-panel prepos-side-panel prepos-side-panel-right hidden">
  <div class="panel-header">
    <b>Pattern Manager</b>
    <button id="closePatternManager">✕</button>
  </div>

  <div class="panel-body">

    <div class="flex gap-10">
      <input 
        id="newPatternKey"
        placeholder="Pattern key"
      />

      <input 
        id="newPatternDesc"
        placeholder="Description"
      />

      <button 
        id="addPatternBtn"
        class="primary-btn">
        Add
      </button>
    </div>

    <div id="patternList" class="mt-20"></div>

  </div>

</div>

<div id="caManagerPanel" class="question-bank-panel prepos-side-panel prepos-side-panel-right hidden">
  <div class="panel-header">
    <b>CA Event Manager</b>
    <button id="closeCAManager">✕</button>
  </div>

  <div class="panel-body">

    <div class="flex gap-10">
      <input 
        id="newCAKey"
        placeholder="Event key"
      />

      <input 
        id="newCADesc"
        placeholder="Description"
      />

      <button 
        id="addCABtn"
        class="primary-btn">
        Add
      </button>
    </div>

    <div id="caList" class="mt-20"></div>

  </div>
</div>
<!-- =========================
     SCRIPTS
========================== -->

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- Config -->
<script src="js/config.js?v=20260520"></script>
<script type="module" src="js/auth.js"></script>

<!-- QB Manager -->
<script type="module" src="js/qb-manager.js"></script>

<!-- Debug Console -->
<script src="https://cdn.jsdelivr.net/npm/eruda"></script>
<script>
  eruda.init();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
  <link rel="icon" type="image/png" href="assets/prepos-icon.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PrepOS Creator</title>

<link rel="stylesheet" href="css/style.css">
</head>

<body class="creator pro-surface">

<div id="app-nav-root"></div>

<div class="container card mt-20">
  <h3>Paste Quiz</h3>

  <label for="input">Quiz Content</label>
  <textarea id="input" placeholder="Paste your quiz questions here"></textarea>

  <label for="secondsPerQuestion">Time per question (seconds)</label>
  <input id="secondsPerQuestion" type="number" min="1" placeholder="45 (PrepOS default)">

  <div class="mt-12">
    <button onclick="cleanQCP()">Clean (QCP)</button>
    <button onclick="generate()">Generate Exam</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js?v=20260520"></script>
<script type="module" src="js/auth.js"></script>
<script type="module" src="js/creator.js"></script>

</body>
</html>
